<!doctype html>
<html lang="zh-Hans">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex" />
    <meta name="theme-color" content="#f2f9fa" />
    <title>页面不存在 · 澪空の自介站</title>
    <link rel="icon" href="/assets/mio-logo.svg" type="image/svg+xml" />
    <link rel="stylesheet" href="/404.css?v=1" />
  </head>
  <body class="not-found-page">
    <header class="not-found-header">
      <a class="not-found-logo" href="/" aria-label="返回首页">
        <img
          src="/assets/mio-logo.svg"
          alt="MIO"
          width="54"
          height="18"
        />
      </a>
      <a class="not-found-header-link" href="/">
        返回首页 <span aria-hidden="true">↗</span>
      </a>
    </header>

    <main class="not-found-main">
      <section class="not-found-content" aria-labelledby="not-found-title">
        <p class="not-found-kicker">404 · PAGE NOT FOUND</p>
        <h1 id="not-found-title">你访问的页面不存在。</h1>
        <p class="not-found-description">
          这个地址可能已经更改，或者页面从未存在。
        </p>

        <div class="not-found-art">
          <canvas
            id="not-found-canvas"
            width="1414"
            height="818"
            role="img"
            aria-label="可拖动节点编辑的 404 图形"
          >
            404
          </canvas>
          <p class="not-found-hint">拖动节点试试 · 双击复原</p>
        </div>

        <a class="not-found-button" href="/">
          返回首页
          <span aria-hidden="true">↗</span>
        </a>
      </section>
    </main>

    <script src="/404.js?v=1"></script>
  </body>
</html>
